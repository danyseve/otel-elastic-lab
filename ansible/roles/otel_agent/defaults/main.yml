otel_agent_release_base: https://github.com/open-telemetry/opentelemetry-collector-releases/releases/download
# amd64 on the lab VMs, arm64 on ARM hosts (e.g. Ampere A1 cloud instances).
otel_agent_arch: "{{ 'arm64' if ansible_architecture in ['aarch64', 'arm64'] else 'amd64' }}"
otel_agent_deb: "otelcol-contrib_{{ otelcol_version }}_linux_{{ otel_agent_arch }}.deb"
otel_agent_deb_url: "{{ otel_agent_release_base }}/v{{ otelcol_version }}/{{ otel_agent_deb }}"

# Applications on this host send OTLP here (no TLS, loopback only).
otel_agent_otlp_bind: 127.0.0.1

otel_agent_journald_units:
  - ssh.service
  - otelcol-contrib.service

# Gateway Service in the cluster (MetalLB IP), TLS signed by the lab CA.
otel_agent_exporter_endpoint: "{{ otel_gateway_fqdn }}:4317"
otel_agent_ca_path: /usr/local/share/ca-certificates/otel-lab-ca.crt

otel_agent_storage_dir: /var/lib/otelcol-contrib/storage
