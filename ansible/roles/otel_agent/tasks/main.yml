# The lab CA is issued by cert-manager inside the cluster; read it from there.
- name: Read the lab CA from the cluster
  ansible.builtin.command:
    argv: [k3s, kubectl, -n, cert-manager, get, secret, lab-ca, -o, 'jsonpath={.data.ca\.crt}']
  register: otel_agent_lab_ca
  changed_when: false
  run_once: true
  delegate_to: "{{ groups['k3s_servers'][0] }}"

- name: Trust the lab CA (it signs the gateway certificate)
  ansible.builtin.copy:
    content: "{{ otel_agent_lab_ca.stdout | b64decode }}"
    dest: "{{ otel_agent_ca_path }}"
    mode: "0644"
  notify:
    - Update CA certificates
    - Restart otelcol-contrib

- name: Download otelcol-contrib {{ otelcol_version }}
  ansible.builtin.get_url:
    url: "{{ otel_agent_deb_url }}"
    dest: "/var/cache/apt/archives/otelcol-contrib_{{ otelcol_version }}_amd64.deb"
    mode: "0644"

- name: Install otelcol-contrib
  ansible.builtin.apt:
    deb: "/var/cache/apt/archives/otelcol-contrib_{{ otelcol_version }}_amd64.deb"
  notify: Restart otelcol-contrib

- name: Let the agent read journald
  ansible.builtin.user:
    name: otelcol-contrib
    groups: [adm, systemd-journal]
    append: true
  notify: Restart otelcol-contrib

- name: Persistent queue directory
  ansible.builtin.file:
    path: "{{ otel_agent_storage_dir }}"
    state: directory
    owner: otelcol-contrib
    group: otelcol-contrib
    mode: "0750"

- name: Agent pipeline
  ansible.builtin.template:
    src: agent.yaml.j2
    dest: /etc/otelcol-contrib/config.yaml
    owner: root
    group: otelcol-contrib
    mode: "0640"
    validate: /usr/bin/otelcol-contrib validate --config=%s
  notify: Restart otelcol-contrib

- name: Agent service options
  ansible.builtin.template:
    src: otelcol-contrib.conf.j2
    dest: /etc/otelcol-contrib/otelcol-contrib.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart otelcol-contrib

- name: Enable and start the agent
  ansible.builtin.systemd_service:
    name: otelcol-contrib
    enabled: true
    state: started
