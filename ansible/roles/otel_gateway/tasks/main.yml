- name: System user for the gateway
  ansible.builtin.user:
    name: edot
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Install directory
  ansible.builtin.file:
    path: "{{ otel_gateway_install_dir }}"
    state: directory
    owner: edot
    group: edot
    mode: "0755"

- name: Download and unpack EDOT Collector {{ otel_gateway_version }}
  ansible.builtin.unarchive:
    src: "{{ otel_gateway_url }}"
    dest: "{{ otel_gateway_install_dir }}"
    remote_src: true
    owner: edot
    group: edot
    creates: "{{ otel_gateway_install_dir }}/{{ otel_gateway_release }}"
  notify: Restart edot-gateway

- name: Point 'current' at the installed release
  ansible.builtin.file:
    src: "{{ otel_gateway_install_dir }}/{{ otel_gateway_release }}"
    dest: "{{ otel_gateway_install_dir }}/current"
    state: link
    owner: edot
    group: edot
  notify: Restart edot-gateway

- name: Configuration directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: edot
    mode: "0750"
  loop:
    - /etc/edot
    - /etc/edot/certs

- name: TLS certificate for the OTLP receiver
  ansible.builtin.copy:
    src: "{{ pki_dir }}/{{ item.src }}"
    dest: "/etc/edot/certs/{{ item.dest }}"
    owner: root
    group: edot
    mode: "0640"
  loop:
    - { src: "{{ inventory_hostname }}.crt", dest: node.crt }
    - { src: "{{ inventory_hostname }}.key", dest: node.key }
  loop_control:
    label: "{{ item.dest }}"
  notify: Restart edot-gateway

- name: Gateway pipeline
  ansible.builtin.template:
    src: gateway.yaml.j2
    dest: /etc/edot/gateway.yaml
    owner: root
    group: edot
    mode: "0640"
  notify: Restart edot-gateway

- name: Gateway credentials
  ansible.builtin.copy:
    dest: /etc/edot/edot.env
    content: |
      ES_USERNAME={{ otel_es_user }}
      ES_PASSWORD={{ otel_es_password }}
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Restart edot-gateway

- name: Install systemd unit
  ansible.builtin.template:
    src: edot-gateway.service.j2
    dest: /etc/systemd/system/edot-gateway.service
    mode: "0644"
  notify: Restart edot-gateway

- name: Enable and start the gateway
  ansible.builtin.systemd_service:
    name: edot-gateway
    enabled: true
    state: started
    daemon_reload: true

- name: Apply pending restarts
  ansible.builtin.meta: flush_handlers

- name: Wait for the gateway health check
  ansible.builtin.uri:
    url: http://127.0.0.1:13133/
  register: otel_gateway_health
  until: otel_gateway_health.status == 200
  retries: 12
  delay: 5
