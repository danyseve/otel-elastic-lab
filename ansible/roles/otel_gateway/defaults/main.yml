# EDOT Collector ships inside the Elastic Agent package ("elastic-agent otel").
edot_version: "{{ elastic_version }}"
edot_install_dir: /opt/edot
edot_release: "elastic-agent-{{ edot_version }}-linux-x86_64"
edot_url: "https://artifacts.elastic.co/downloads/beats/elastic-agent/{{ edot_release }}.tar.gz"
