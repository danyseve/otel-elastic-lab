- name: Install Kibana
  ansible.builtin.apt:
    name: "kibana={{ elastic_version }}"
    update_cache: true

- name: Hold the Kibana package
  ansible.builtin.dpkg_selections:
    name: kibana
    selection: hold

- name: Certificates directory
  ansible.builtin.file:
    path: /etc/kibana/certs
    state: directory
    owner: root
    group: kibana
    mode: "0750"

- name: Copy lab CA and node certificate
  ansible.builtin.copy:
    src: "{{ pki_dir }}/{{ item.src }}"
    dest: "/etc/kibana/certs/{{ item.dest }}"
    owner: root
    group: kibana
    mode: "0640"
  loop:
    - { src: ca.crt, dest: ca.crt }
    - { src: "{{ inventory_hostname }}.crt", dest: node.crt }
    - { src: "{{ inventory_hostname }}.key", dest: node.key }
  loop_control:
    label: "{{ item.dest }}"
  notify: Restart kibana

- name: Configure kibana.yml
  ansible.builtin.template:
    src: kibana.yml.j2
    dest: /etc/kibana/kibana.yml
    owner: root
    group: kibana
    mode: "0640"
  notify: Restart kibana

- name: Enable and start Kibana
  ansible.builtin.systemd_service:
    name: kibana
    enabled: true
    state: started

- name: Apply pending restarts
  ansible.builtin.meta: flush_handlers

- name: Wait for Kibana to be available
  ansible.builtin.uri:
    url: https://localhost:5601/api/status
    user: elastic
    password: "{{ elastic_password }}"
    force_basic_auth: true
  register: kibana_status
  until: kibana_status.status == 200
  retries: 30
  delay: 10
  no_log: true
