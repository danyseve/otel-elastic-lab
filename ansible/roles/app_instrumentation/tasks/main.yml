# Injects standard OTEL_* variables into existing systemd services through a
# drop-in, so application units stay untouched.

- name: Drop-in directories
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ item.unit }}.d"
    state: directory
    mode: "0755"
  loop: "{{ instrumented_services }}"
  loop_control:
    label: "{{ item.unit }}"

- name: OpenTelemetry drop-ins
  ansible.builtin.template:
    src: otel.conf.j2
    dest: "/etc/systemd/system/{{ item.unit }}.d/otel.conf"
    mode: "0644"
  loop: "{{ instrumented_services }}"
  loop_control:
    label: "{{ item.unit }}"
  register: app_instrumentation_dropins
  notify: Restart instrumented services
