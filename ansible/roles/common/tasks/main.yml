- name: Install base packages
  ansible.builtin.apt:
    name:
      - qemu-guest-agent
      - chrony
      - curl
      - jq
      - gnupg
      - ca-certificates
    update_cache: true
    cache_valid_time: 3600

- name: Set timezone
  community.general.timezone:
    name: "{{ lab_timezone }}"

- name: Lab hosts in /etc/hosts
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: "# {mark} otel-lab"
    block: |
      {% for h in groups['all'] %}
      {{ hostvars[h].ansible_host }} {{ h }}.{{ lab_domain }} {{ h }}
      {% endfor %}
      {{ otel_gateway_lb_ip }} {{ otel_gateway_fqdn }} otel-gw

- name: Disable swap (required by the kubelet and by Elasticsearch)
  ansible.builtin.command: swapoff -a
  when: ansible_swaptotal_mb | int > 0
  changed_when: true
