# The bootstrap password only lives in the keystore until it is persisted.
- name: Persist the 'elastic' password in the security index
  ansible.builtin.uri:
    url: https://localhost:9200/_security/user/elastic/_password
    method: POST
    user: elastic
    password: "{{ elastic_password }}"
    force_basic_auth: true
    body_format: json
    body:
      password: "{{ elastic_password }}"
  changed_when: false
  no_log: true

- name: Set the 'kibana_system' password
  ansible.builtin.uri:
    url: https://localhost:9200/_security/user/kibana_system/_password
    method: POST
    user: elastic
    password: "{{ elastic_password }}"
    force_basic_auth: true
    body_format: json
    body:
      password: "{{ kibana_system_password }}"
  changed_when: false
  no_log: true

# Least privilege for the collectors: write OTel data streams + read cluster stats.
- name: Role for OpenTelemetry collectors
  ansible.builtin.uri:
    url: "https://localhost:9200/_security/role/{{ otel_es_user }}"
    method: PUT
    user: elastic
    password: "{{ elastic_password }}"
    force_basic_auth: true
    body_format: json
    body:
      cluster: [monitor]
      indices:
        - names: ["logs-*", "metrics-*", "traces-*"]
          privileges: [auto_configure, create_doc]
        - names: ["*"]
          privileges: [monitor]
  changed_when: false
  no_log: true

- name: User for OpenTelemetry collectors
  ansible.builtin.uri:
    url: "https://localhost:9200/_security/user/{{ otel_es_user }}"
    method: PUT
    user: elastic
    password: "{{ elastic_password }}"
    force_basic_auth: true
    body_format: json
    body:
      password: "{{ otel_es_password }}"
      roles: ["{{ otel_es_user }}"]
      full_name: OpenTelemetry collectors
  changed_when: false
  no_log: true
