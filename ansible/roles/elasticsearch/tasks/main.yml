- name: Kernel settings for Elasticsearch
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/90-elasticsearch.conf
    reload: true
  loop:
    - { name: vm.max_map_count, value: "262144" }
    - { name: vm.swappiness, value: "1" }

- name: Install Elasticsearch
  ansible.builtin.apt:
    name: "elasticsearch={{ elastic_version }}"
    update_cache: true

- name: Hold the Elasticsearch package (upgrades are deliberate)
  ansible.builtin.dpkg_selections:
    name: elasticsearch
    selection: hold

- name: Certificates directory
  ansible.builtin.file:
    path: "{{ elasticsearch_certs_dir }}"
    state: directory
    owner: root
    group: elasticsearch
    mode: "0750"

- name: Copy lab CA and node certificate
  ansible.builtin.copy:
    src: "{{ pki_dir }}/{{ item.src }}"
    dest: "{{ elasticsearch_certs_dir }}/{{ item.dest }}"
    owner: root
    group: elasticsearch
    mode: "0640"
  loop:
    - { src: ca.crt, dest: ca.crt }
    - { src: "{{ inventory_hostname }}.crt", dest: node.crt }
    - { src: "{{ inventory_hostname }}.key", dest: node.key }
  loop_control:
    label: "{{ item.dest }}"
  notify: Restart elasticsearch

- name: List keystore entries
  ansible.builtin.command: "{{ elasticsearch_keystore_bin }} list"
  register: elasticsearch_keystore
  changed_when: false

- name: Remove auto-configuration secrets
  ansible.builtin.command: "{{ elasticsearch_keystore_bin }} remove {{ item }}"
  loop: "{{ elasticsearch_autoconfig_secrets }}"
  when: item in elasticsearch_keystore.stdout_lines
  changed_when: true
  notify: Restart elasticsearch

- name: Seed the bootstrap password of the 'elastic' user
  ansible.builtin.shell: |
    set -o pipefail
    printf '%s' "$ES_BOOTSTRAP_PW" | {{ elasticsearch_keystore_bin }} add -x -f bootstrap.password
  args:
    executable: /bin/bash
  environment:
    ES_BOOTSTRAP_PW: "{{ elastic_password }}"
  when: "'bootstrap.password' not in elasticsearch_keystore.stdout_lines"
  changed_when: true
  no_log: true

- name: Configure elasticsearch.yml
  ansible.builtin.template:
    src: elasticsearch.yml.j2
    dest: /etc/elasticsearch/elasticsearch.yml
    owner: root
    group: elasticsearch
    mode: "0660"
  notify: Restart elasticsearch

- name: JVM heap
  ansible.builtin.template:
    src: heap.options.j2
    dest: /etc/elasticsearch/jvm.options.d/heap.options
    owner: root
    group: elasticsearch
    mode: "0660"
  notify: Restart elasticsearch

- name: Enable and start Elasticsearch
  ansible.builtin.systemd_service:
    name: elasticsearch
    enabled: true
    state: started
    daemon_reload: true

- name: Apply pending restarts
  ansible.builtin.meta: flush_handlers

- name: Wait until the cluster has formed
  ansible.builtin.uri:
    url: https://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=50s
    user: elastic
    password: "{{ elastic_password }}"
    force_basic_auth: true
  register: elasticsearch_health
  until: elasticsearch_health.status == 200
  retries: 30
  delay: 10
  no_log: true

- name: Users and roles
  ansible.builtin.include_tasks: security.yml
  run_once: true
