- name: Kernel settings for Elasticsearch and the collectors
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/90-otel-lab.conf
    reload: true
  loop: "{{ k3s_sysctls }}"

- name: Create the k3s configuration directory
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    mode: "0755"

- name: Configure k3s
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    mode: "0600"
  notify: Restart k3s

- name: Download the k3s installer
  ansible.builtin.get_url:
    url: "{{ k3s_install_url }}"
    dest: /usr/local/bin/k3s-install.sh
    mode: "0755"

- name: Install k3s on the first server (initialises etcd)
  ansible.builtin.command: /usr/local/bin/k3s-install.sh
  args:
    creates: /usr/local/bin/k3s
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
    INSTALL_K3S_EXEC: server
  when: inventory_hostname == k3s_first_server

- name: Wait for the first server API
  ansible.builtin.command: k3s kubectl get --raw /readyz
  register: k3s_first_ready
  until: k3s_first_ready.rc == 0
  retries: 30
  delay: 10
  changed_when: false
  when: inventory_hostname == k3s_first_server

- name: Join the remaining servers, one at a time
  ansible.builtin.command: /usr/local/bin/k3s-install.sh
  args:
    creates: /usr/local/bin/k3s
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
    INSTALL_K3S_EXEC: server
  throttle: 1
  when: inventory_hostname != k3s_first_server

- name: Wait until every node is Ready
  ansible.builtin.command: k3s kubectl wait --for=condition=Ready node --all --timeout=300s
  changed_when: false
  run_once: true
  delegate_to: "{{ k3s_first_server }}"

- name: Read the admin kubeconfig
  ansible.builtin.slurp:
    src: /etc/rancher/k3s/k3s.yaml
  register: k3s_kubeconfig
  run_once: true
  delegate_to: "{{ k3s_first_server }}"

- name: Kubeconfig directory on the control node
  ansible.builtin.file:
    path: "{{ k3s_kubeconfig_local | dirname }}"
    state: directory
    mode: "0700"
  run_once: true
  delegate_to: localhost
  become: false

- name: Write the kubeconfig on the control node
  ansible.builtin.copy:
    content: "{{ k3s_kubeconfig.content | b64decode | replace('https://127.0.0.1:6443', 'https://' ~ hostvars[k3s_first_server].ansible_host ~ ':6443') }}"
    dest: "{{ k3s_kubeconfig_local }}"
    mode: "0600"
  run_once: true
  delegate_to: localhost
  become: false
  no_log: true
