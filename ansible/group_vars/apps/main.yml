# The local agent receives OTLP from the applications on this VM.
otel_agent_otlp_enabled: true

otel_agent_journald_units:
  - ssh.service
  - otelcol-contrib.service
  - ascenda.service
  - bjj-app.service

# systemd services that get OTEL_* environment variables injected (see apps/README.md).
instrumented_services: []
