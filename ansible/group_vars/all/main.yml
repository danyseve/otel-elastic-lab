lab_environment: lab
lab_timezone: Europe/Madrid

# Pin versions; bump deliberately.
k3s_version: "v1.33.5+k3s1"
otelcol_version: "0.136.0"

# MetalLB IP of the OTel gateway Service. Must match ips.otelGateway in k8s/values/lab.yaml.
otel_gateway_lb_ip: 10.0.0.40
otel_gateway_fqdn: "otel-gw.{{ lab_domain }}"

# Secrets live in group_vars/all/vault.yml (ansible-vault).
k3s_token: "{{ vault_k3s_token }}"
