- name: Base operating system
  hosts: all
  become: true
  tags: [common]
  roles:
    - common

- name: K3s cluster (3 servers, embedded etcd)
  hosts: k3s_servers
  become: true
  tags: [k3s]
  roles:
    - k3s

# Everything inside the cluster (ECK, OTel Operator, MetalLB...) is deployed
# with Helmfile from k8s/ - see `make platform`.

- name: OTel agent and instrumentation on hosts outside the cluster
  hosts: apps
  become: true
  tags: [otel, apps]
  roles:
    - otel_agent
    - app_instrumentation
