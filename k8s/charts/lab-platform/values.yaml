# Defaults; real values come from k8s/values/lab.yaml.
domain: lab.example

metallb:
  addresses: []

ips:
  otelGateway: ""
  kibana: ""

elastic:
  version: "9.2.0"
  esCount: 3
  esMemory: 8Gi
  esCpu: "2"
  esStorage: 120Gi # PVC de datos por nodo (3 PVs, uno por VM sobre discos de 150G)
  storageClass: local-path
  kibanaMemory: 2Gi

# Pods behind the external OTLP Service (created by the OTel Operator).
otelGateway:
  collectorName: otel-gateway-collector
