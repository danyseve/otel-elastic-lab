apiVersion: elasticsearch.k8s.elastic.co/v1
kind: Elasticsearch
metadata:
  name: lab
  namespace: {{ .Release.Namespace }}
spec:
  version: {{ .Values.elastic.version | quote }}
  # Collector credentials are declared, not created by hand (see otel-writer.yaml).
  auth:
    roles:
      - secretName: otel-writer-role
    fileRealm:
      - secretName: otel-writer-user
  nodeSets:
    - name: default
      count: {{ .Values.elastic.esCount }}
      config:
        node.roles: ["master", "data", "ingest"]
        # local-path no impone cuota: el tamaño del PVC no limita nada, ES mide el
        # rootfs real del nodo y el kubelet empieza a expulsar pods cuando queda
        # menos del 10 % libre. Umbrales escalonados para drenar shards mucho antes.
        cluster.routing.allocation.disk.watermark.low: "80%"
        cluster.routing.allocation.disk.watermark.high: "85%"
        cluster.routing.allocation.disk.watermark.flood_stage: "88%"
      podTemplate:
        spec:
          containers:
            - name: elasticsearch
              resources:
                requests:
                  memory: {{ .Values.elastic.esMemory }}
                  cpu: {{ .Values.elastic.esCpu | quote }}
                limits:
                  memory: {{ .Values.elastic.esMemory }}
          # One ES node per k3s node, so one host failure never costs two copies of a shard.
          affinity:
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - topologyKey: kubernetes.io/hostname
                  labelSelector:
                    matchLabels:
                      elasticsearch.k8s.elastic.co/cluster-name: lab
      volumeClaimTemplates:
        - metadata:
            name: elasticsearch-data
          spec:
            accessModes: ["ReadWriteOnce"]
            storageClassName: {{ .Values.elastic.storageClass }}
            resources:
              requests:
                storage: {{ .Values.elastic.esStorage }}
